[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaspsolkit"
version = "0.2.1"
description = "State-driven terminal workflow for VASPsol constant-potential charge sweeps"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "VASPsolKit contributors"}]
keywords = ["VASP", "VASPsol", "DFT", "electrochemistry", "constant-potential", "HPC"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]
release = ["build>=1"]

[project.scripts]
vaspsolkit = "vaspsolkit.cli:main"

[tool.setuptools.packages.find]
include = ["vaspsolkit*"]

[tool.setuptools.package-data]
vaspsolkit = ["data/*.xlsx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
