name: documentation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]" -r docs/requirements.txt
      - run: python -m pytest -q
      - run: python -m sphinx -n -W --keep-going -b html docs build/docs
      - run: python -m pytest --noconftest -q tests/test_docs_site.py
        env:
          VASPSOLKIT_DOCS_BUILD: build/docs
      - run: python -m pip install -r docs/browser-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_manual_browser.py --build build/docs --output build/browser-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaspsolkit-manual-browser-qa
          path: build/browser-qa/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: vaspsolkit-user-manual
          path: build/docs/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/docs/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
